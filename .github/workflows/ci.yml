name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: pwsh tests/OwaspForge.Tests/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-restore
      - run: dotnet format --verify-no-changes
      - run: dotnet list OwaspForge.sln package --vulnerable --include-transitive
      - run: docker compose --profile demos config
      - run: docker compose --profile demos build
      - name: Start local platform and challenge demos
        run: docker compose --profile demos up -d
      - name: Inspect local containers
        run: |
          docker compose --profile demos ps
          docker compose --profile demos port platform 8080 || true
          docker inspect owasp-training-platform-1 --format '{{.State.Status}} {{.State.ExitCode}} {{json .NetworkSettings.Ports}}' || true
      - name: Smoke-test localhost endpoints
        shell: bash
        run: |
          set -euo pipefail
          expected=(platform demo-sql-injection demo-xss demo-idor demo-authentication demo-file-upload demo-ssrf)
          for service in "${expected[@]}"; do
            container_id="$(docker compose --profile demos ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Status}}' "$container_id")" = running
          done
          docker compose --profile demos logs --no-color --tail=80 platform
      - name: Stop local containers
        if: always()
        run: docker compose --profile demos down --volumes --remove-orphans
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
